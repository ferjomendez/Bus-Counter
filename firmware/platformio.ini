; Firmware del contador de pasajeros (ESP32 + 2x VL53L0X).
;   Compilar y grabar:   python manage.py flash   (o: pio run -e esp32dev -t upload)
;   Tests de la logica:  pio test -e native        (necesita un compilador C++ en el PC)

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; Particion con mas espacio para la app (TLS + WiFi + web ocupan bastante)
board_build.partitions = min_spiffs.csv
lib_deps =
  adafruit/Adafruit_VL53L0X@^1.2.4
  bertmelis/espMqttClient@^1.7.0
  bblanchon/ArduinoJson@^7.2.0
; Genera include/secrets.h a partir de broker/certs/ca.crt y .env antes de compilar
extra_scripts = pre:scripts/gen_secrets.py
test_ignore = test_counter

[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -Wall
