# Broker para el contador de pasajeros. manage.py lo ejecuta desde esta carpeta
# (broker/), que contiene certs/, passwd y acl.txt:  mosquitto -c mosquitto.conf -v
# certs/ y passwd se generan solos con: python manage.py broker (o start).

listener 8883
cafile certs/ca.crt
certfile certs/server.crt
keyfile certs/server.key
# En Mosquitto 2.x es la version minima: se aceptan TLS 1.2 y 1.3
tls_version tlsv1.2

allow_anonymous false
password_file passwd
acl_file acl.txt

# Conserva los mensajes retenidos (count, status) si el broker se reinicia
persistence true
persistence_location data/

log_dest stdout
