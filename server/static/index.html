<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>Contador de pasajeros</title>
  <link rel="preload" href="fonts/archivo-latin-wdth-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/app.css">
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
</head>
<body>
  <a class="skip" href="#view">Ir al contenido</a>

  <header class="masthead">
    <div class="masthead-inner">
      <a class="brand" href="#/" aria-label="Contador de pasajeros, ir al panel">
        <img src="img/logo-fic.png" alt="Universidad Adolfo Ibáñez, Facultad de Ingeniería y Ciencias" width="289" height="164">
        <span class="brand-name">Contador de pasajeros</span>
      </a>
      <dl class="summary" aria-live="polite">
        <div class="figure">
          <dt>Buses en servicio</dt>
          <dd id="sum-buses">–</dd>
        </div>
        <div class="figure">
          <dt>Pasajeros en total</dt>
          <dd id="sum-passengers">–</dd>
        </div>
        <div class="figure figure-action">
          <dt><button type="button" id="open-recs" aria-haspopup="dialog">Recomendaciones activas</button></dt>
          <dd id="sum-recs">–</dd>
        </div>
      </dl>
      <a class="settings-link" href="#/config">
        <svg aria-hidden="true" viewBox="0 0 24 24" width="22" height="22"><path d="M10.3 2h3.4l.5 2.6c.6.2 1.2.5 1.7.9l2.5-.9 1.7 2.9-2 1.8a7.4 7.4 0 0 1 0 1.9l2 1.8-1.7 2.9-2.5-.9c-.5.4-1.1.7-1.7.9l-.5 2.6h-3.4l-.5-2.6c-.6-.2-1.2-.5-1.7-.9l-2.5.9-1.7-2.9 2-1.8a7.4 7.4 0 0 1 0-1.9l-2-1.8 1.7-2.9 2.5.9c.5-.4 1.1-.7 1.7-.9L10.3 2Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="11.5" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
        <span>Configuración</span>
      </a>
    </div>
  </header>

  <nav class="band" id="band" aria-label="Recorridos"></nav>

  <div class="notice-bar" id="link-status" role="status" hidden></div>

  <main id="view" tabindex="-1"></main>

  <dialog id="recs-dialog" class="sheet" aria-labelledby="recs-title">
    <div class="sheet-head">
      <h2 id="recs-title">Recomendaciones activas</h2>
      <button type="button" class="icon-btn" data-close aria-label="Cerrar">
        <svg aria-hidden="true" viewBox="0 0 24 24" width="22" height="22"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div id="recs-list"></div>
  </dialog>

  <dialog id="confirm-dialog" class="sheet sheet-small" aria-labelledby="confirm-title">
    <form method="dialog">
      <h2 id="confirm-title"></h2>
      <p id="confirm-text"></p>
      <div class="actions">
        <button value="cancel" class="btn btn-quiet">Cancelar</button>
        <button value="ok" class="btn btn-primary" id="confirm-ok">Confirmar</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="vendor/chart.umd.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
